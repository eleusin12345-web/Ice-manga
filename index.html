<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MangaWeb PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#1f1f22', 900: '#18181b', 950: '#09090b' },
                        primary: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }
        
        .no-scroll { overflow: hidden; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        
        .modal-enter { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
        .modal-enter > div { transform: scale(1) translateY(0) !important; opacity: 1 !important; }
        
        .drawer-open { transform: translateX(0) !important; }
        
        .card-hover:active { transform: scale(0.96); }
        @media (hover: hover) { .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3); } }
        
        .reader-ui-hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .reader-ui-hidden-bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased overflow-x-hidden select-none pb-safe">

    <!-- ГЛОБАЛЬНЫЙ TOAST -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] bg-primary-600 text-white px-5 py-3 rounded-2xl shadow-2xl font-bold flex items-center gap-3 text-sm opacity-0 pointer-events-none transform -translate-y-10 smooth-transition">
        <i class="fa-solid fa-bell text-lg"></i>
        <span id="toast-msg">Синхронизация...</span>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header id="main-header" class="fixed top-0 left-0 right-0 z-40 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/50 h-16 flex items-center justify-between px-4 smooth-transition">
        <div class="flex items-center gap-4">
            <button onclick="window.toggleDrawer()" class="text-zinc-400 hover:text-white p-2 text-xl active:scale-90 smooth-transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.goHome()">
                <i class="fa-solid fa-bolt text-primary-500 text-xl"></i>
                <span class="font-black text-xl tracking-tight hidden sm:block">Manga<span class="text-primary-500">PRO</span></span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="cloud-status" class="flex items-center gap-2 text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-zinc-900 px-3 py-1.5 rounded-full border border-zinc-800 shadow-inner">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text" class="text-zinc-400">Подключение...</span>
            </div>
        </div>
    </header>

    <!-- БОКОВОЕ МЕНЮ -->
    <div id="drawer-backdrop" onclick="window.toggleDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 opacity-0 invisible smooth-transition"></div>
    <div id="drawer" class="fixed top-0 left-0 bottom-0 w-72 bg-zinc-900 border-r border-zinc-800 z-50 transform -translate-x-full smooth-transition flex flex-col shadow-2xl">
        <div class="p-6 flex items-center justify-between border-b border-zinc-800">
            <span class="font-black text-2xl text-white">Меню</span>
            <button onclick="window.toggleDrawer()" class="text-zinc-500 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-2 px-3">
            <button onclick="window.goHome(); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-300 font-bold smooth-transition">
                <i class="fa-solid fa-house w-6 text-center text-zinc-500"></i> Главная
            </button>
            <button onclick="window.switchTab('favorites'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-300 font-bold smooth-transition">
                <i class="fa-solid fa-star w-6 text-center text-yellow-500"></i> Избранное
            </button>
            <div class="my-2 border-t border-zinc-800 mx-3"></div>
            
            <div id="admin-menu" class="hidden flex-col gap-2">
                <div class="text-xs font-bold text-zinc-500 uppercase px-4 mt-2 mb-1 tracking-wider">Кабинет Автора</div>
                <button onclick="window.showModal('modal-add-manga'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl bg-primary-600/10 text-primary-400 hover:bg-primary-600/20 font-bold smooth-transition text-left">
                    <i class="fa-solid fa-plus w-6 text-center"></i> Добавить Мангу
                </button>
                <button onclick="window.logoutAdmin()" class="flex items-center gap-4 p-3 rounded-xl text-red-400 hover:bg-red-500/10 font-bold smooth-transition text-left mt-2">
                    <i class="fa-solid fa-right-from-bracket w-6 text-center"></i> Выйти из панели
                </button>
            </div>
            
            <button id="btn-login-admin" onclick="window.showModal('modal-auth'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-400 font-bold smooth-transition mt-auto">
                <i class="fa-solid fa-lock w-6 text-center text-zinc-600"></i> Вход для Автора
            </button>
        </div>
    </div>

    <!-- КОНТЕНТ -->
    <main id="main-content" class="pt-20 pb-20 px-4 max-w-6xl mx-auto min-h-screen flex flex-col">
        <!-- 1. ГЛАВНАЯ СТРАНИЦА -->
        <section id="view-home" class="flex-1 flex flex-col">
            <div class="flex gap-2 sm:gap-4 mb-6 overflow-x-auto pb-2 custom-scrollbar border-b border-zinc-800">
                <button onclick="window.switchTab('catalog')" id="tab-catalog" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-primary-500 text-white whitespace-nowrap smooth-transition">📚 Каталог</button>
                <button onclick="window.switchTab('latest')" id="tab-latest" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 whitespace-nowrap smooth-transition">🔥 Обновления</button>
                <button onclick="window.switchTab('favorites')" id="tab-favorites" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 whitespace-nowrap smooth-transition">⭐ Избранное</button>
            </div>

            <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 relative min-h-[300px]"></div>
            <div id="latest-container" class="hidden flex-col gap-3 relative min-h-[300px]"></div>
            
            <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-zinc-500 pointer-events-none mt-20">
                <i class="fa-solid fa-box-open text-6xl mb-4 opacity-20"></i>
                <p class="text-lg font-bold text-zinc-400">Здесь пока пусто</p>
                <p class="text-sm mt-1">Добавьте мангу или подождите обновлений.</p>
            </div>
        </section>

        <!-- 2. СТРАНИЦА ДЕТАЛЕЙ МАНГИ -->
        <section id="view-details" class="hidden flex-1">
            <button onclick="window.goHome()" class="mb-6 text-zinc-400 hover:text-white flex items-center gap-2 text-sm bg-zinc-900 py-2.5 px-5 rounded-full w-fit border border-zinc-800 smooth-transition active:scale-95">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            
            <div class="bg-zinc-900/50 rounded-[2rem] p-4 sm:p-8 border border-zinc-800/80 flex flex-col md:flex-row gap-6 sm:gap-10 shadow-2xl relative">
                <button onclick="window.deleteCurrentManga()" class="admin-only hidden absolute top-4 right-4 sm:top-8 sm:right-8 text-red-500 hover:text-white bg-red-500/10 hover:bg-red-500 w-12 h-12 rounded-2xl flex items-center justify-center smooth-transition shadow-lg" title="Удалить тайтл">
                    <i class="fa-solid fa-trash"></i>
                </button>

                <div class="w-full md:w-72 shrink-0 relative group">
                    <img id="det-cover" src="" class="w-full aspect-[2/3] object-cover rounded-2xl bg-zinc-950 shadow-2xl border border-zinc-800" alt="Cover" onerror="this.src='https://via.placeholder.com/300x450/18181b/ffffff?text=Нет+обложки'">
                    <button onclick="window.toggleFavorite()" id="btn-fav" class="absolute bottom-4 right-4 w-12 h-12 bg-zinc-900/80 backdrop-blur-md border border-zinc-700 rounded-full flex items-center justify-center text-xl smooth-transition hover:scale-110 shadow-lg">
                        <i class="fa-regular fa-star text-zinc-300" id="fav-icon"></i>
                    </button>
                </div>
                
                <div class="flex-1 flex flex-col">
                    <h1 id="det-title" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white pr-12 mb-4 leading-tight">...</h1>
                    <div class="bg-zinc-950/50 p-5 rounded-2xl mb-8 border border-zinc-800/50">
                        <h3 class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-3">Сюжет</h3>
                        <p id="det-desc" class="text-zinc-300 text-sm sm:text-base leading-relaxed">...</p>
                    </div>
                    
                    <div class="mt-auto">
                        <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800">
                            <h3 class="font-black text-xl text-white">Список глав</h3>
                            <button onclick="window.showModal('modal-add-chapter')" class="admin-only hidden bg-primary-600 hover:bg-primary-500 text-white font-bold text-sm py-2 px-4 rounded-xl flex items-center gap-2 smooth-transition shadow-lg shadow-primary-600/20 active:scale-95">
                                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Добавить главу</span>
                            </button>
                        </div>
                        <div id="det-chapters" class="flex flex-col gap-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 3. ЧИТАЛКА (МАНХВА / ВЕБТУН - ВЕРТИКАЛЬНЫЙ СКРОЛЛ) -->
    <div id="view-reader" class="hidden fixed inset-0 z-[60] bg-black overflow-y-auto custom-scrollbar">
        <!-- Кликабельная зона для вызова меню (срабатывает, если кликнуть не по картинке) -->
        <div id="reader-click-zone" class="fixed inset-0 z-0" onclick="window.toggleReaderUI()"></div>
        
        <div id="reader-topbar" class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-lg border-b border-zinc-800/80 p-4 flex items-center justify-between z-20 smooth-transition">
            <button onclick="window.closeReader()" class="text-zinc-400 hover:text-white bg-zinc-900 w-10 h-10 rounded-full flex items-center justify-center smooth-transition active:scale-90">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="text-center truncate px-4 pointer-events-none">
                <div id="read-manga-title" class="text-xs font-bold text-zinc-500 uppercase tracking-widest truncate">...</div>
                <div id="read-chapter-title" class="text-sm sm:text-base font-black text-primary-400 truncate mt-0.5">...</div>
            </div>
            <div class="w-10 text-zinc-600 text-xl pointer-events-none text-center"><i class="fa-solid fa-mobile-screen"></i></div>
        </div>

        <!-- Контейнер для картинок манхвы -->
        <div id="reader-pages" class="relative z-10 w-full max-w-[800px] mx-auto flex flex-col items-center mt-[72px] mb-[80px] bg-black" onclick="window.toggleReaderUI()">
            <!-- Картинки будут вставляться сюда столбиком -->
        </div>

        <div id="reader-bottombar" class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-lg border-t border-zinc-800/80 p-4 z-20 smooth-transition">
            <div class="max-w-[800px] mx-auto grid grid-cols-2 gap-4">
                <button id="btn-prev-chap" onclick="window.changeChapter(1)" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-white font-bold py-3 sm:py-4 rounded-xl smooth-transition disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline text-xs sm:text-base">Предыдущая глава</span>
                </button>
                <button id="btn-next-chap" onclick="window.changeChapter(-1)" class="bg-primary-600 hover:bg-primary-500 text-white font-bold py-3 sm:py-4 rounded-xl smooth-transition disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 shadow-lg shadow-primary-600/20 flex items-center justify-center gap-2">
                    <span class="hidden sm:inline text-xs sm:text-base">Следующая глава</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА -->
    
    <!-- Вход для автора -->
    <div id="modal-auth" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible pointer-events-none smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-[2rem] p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition text-center">
            <div class="w-16 h-16 bg-primary-600/10 text-primary-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h3 class="text-2xl font-black text-white mb-2">Создатель</h3>
            <p class="text-sm text-zinc-500 mb-8">Введите ПИН-код (1234)</p>
            <form onsubmit="window.loginAdmin(event)" class="space-y-4">
                <input type="password" id="in-admin-pass" required class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-center text-white tracking-widest font-bold text-xl focus:outline-none focus:border-primary-500 smooth-transition" placeholder="****">
                <button type="submit" class="w-full bg-primary-600 hover:bg-primary-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 smooth-transition">Войти</button>
            </form>
            <button onclick="window.hideModal('modal-auth')" class="mt-6 text-sm font-bold text-zinc-500 hover:text-zinc-300">Отмена</button>
        </div>
    </div>

    <!-- Добавить Мангу -->
    <div id="modal-add-manga" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible pointer-events-none smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-white">Новый тайтл</h3>
                <button onclick="window.hideModal('modal-add-manga')" class="text-zinc-500 hover:text-white bg-zinc-800/50 w-10 h-10 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="window.submitManga(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Название</label>
                    <input type="text" id="in-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="Берсерк">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Обложка (URL)</label>
                    <input type="url" id="in-cover" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Сюжет</label>
                    <textarea id="in-desc" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none resize-none" placeholder="Описание..."></textarea>
                </div>
                <button type="submit" id="btn-submit-manga" class="w-full bg-primary-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 smooth-transition mt-2">Опубликовать</button>
            </form>
        </div>
    </div>

    <!-- Добавить Главу -->
    <div id="modal-add-chapter" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible pointer-events-none smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-white">Новая глава</h3>
                <button onclick="window.hideModal('modal-add-chapter')" class="text-zinc-500 hover:text-white bg-zinc-800/50 w-10 h-10 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="window.submitChapter(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Название главы</label>
                    <input type="text" id="in-chap-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="Глава 1">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Ссылки (каждая с новой строки)</label>
                    <textarea id="in-chap-urls" required rows="6" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white text-xs whitespace-pre focus:border-primary-500 outline-none" placeholder="https://raw.githubusercontent.com/.../img1.jpg&#10;https://.../img2.jpg"></textarea>
                </div>
                <button type="submit" id="btn-submit-chapter" class="w-full bg-primary-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 smooth-transition mt-2">Загрузить в базу</button>
            </form>
        </div>
    </div>

    <!-- FIREBASE И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ТВОЯ КОНФИГУРАЦИЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCz1zBOWTXWZHnUjzQq2-Tsh20df-O_qb4",
            authDomain: "mangaweb-ee8fc.firebaseapp.com",
            projectId: "mangaweb-ee8fc",
            storageBucket: "mangaweb-ee8fc.firebasestorage.app",
            messagingSenderId: "415476811249",
            appId: "1:415476811249:web:4c1169537a0d2491833050"
        };

        const appIdStr = 'mangaweb-ee8fc'; 
        const ADMIN_PIN = "1234";

        let dbRef = null;
        let authRef = null;
        let user = null;
        
        let dbMangas = [];
        let dbChapters = [];
        let favoriteIds = [];
        
        let currentTab = 'catalog';
        let currentMangaId = null;
        let currentChapIdx = null;
        let isUiHidden = false;
        
        window.isAdmin = localStorage.getItem('MW_IS_ADMIN') === 'true';

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function initApp() {
            loadFavorites();
            checkAdminStatus();
            
            try {
                const app = initializeApp(firebaseConfig);
                authRef = getAuth(app);
                dbRef = getFirestore(app);

                try { await signInAnonymously(authRef); } 
                catch (authError) {
                    setNetStatus('online', 'Подключено (без Auth)');
                    listenData();
                }

                onAuthStateChanged(authRef, (u) => {
                    user = u;
                    if (user) {
                        setNetStatus('online', 'Онлайн (База данных)');
                        listenData();
                    }
                });
            } catch (err) { setNetStatus('error', 'Ошибка сети'); }
        }

        function setNetStatus(type, text) {
            const dot = document.getElementById('status-dot');
            document.getElementById('status-text').textContent = text;
            dot.className = 'w-2 h-2 rounded-full ' + (type === 'online' ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : type === 'error' ? 'bg-red-500' : 'bg-amber-500 animate-pulse');
        }

        function listenData() {
            if (!dbRef) return;
            const mRef = collection(dbRef, 'artifacts', appIdStr, 'public', 'data', 'mangas');
            onSnapshot(mRef, (snap) => {
                dbMangas = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                refreshUI();
            });

            const cRef = collection(dbRef, 'artifacts', appIdStr, 'public', 'data', 'chapters');
            onSnapshot(cRef, (snap) => {
                dbChapters = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                refreshUI();
            });
        }

        function refreshUI() {
            if (!document.getElementById('view-home').classList.contains('hidden')) window.switchTab(currentTab);
            if (!document.getElementById('view-details').classList.contains('hidden') && currentMangaId) renderDetails(currentMangaId);
        }

        // --- ЗАКЛАДКИ ---
        function loadFavorites() { try { favoriteIds = JSON.parse(localStorage.getItem('MW_FAVS') || '[]'); } catch(e) { favoriteIds = []; } }
        function saveFavorites() { localStorage.setItem('MW_FAVS', JSON.stringify(favoriteIds)); }

        window.toggleFavorite = function() {
            if (!currentMangaId) return;
            const idx = favoriteIds.indexOf(currentMangaId);
            if (idx === -1) { favoriteIds.push(currentMangaId); showToast('Добавлено в Избранное ⭐'); } 
            else { favoriteIds.splice(idx, 1); showToast('Удалено из Избранного'); }
            saveFavorites(); renderDetails(currentMangaId);
        }

        // --- АДМИНКА ---
        function checkAdminStatus() {
            const els = document.querySelectorAll('.admin-only');
            els.forEach(el => window.isAdmin ? el.classList.remove('hidden') : el.classList.add('hidden'));
            const menu = document.getElementById('admin-menu'); const loginBtn = document.getElementById('btn-login-admin');
            if (window.isAdmin) { menu.classList.remove('hidden'); menu.classList.add('flex'); loginBtn.classList.add('hidden'); } 
            else { menu.classList.add('hidden'); menu.classList.remove('flex'); loginBtn.classList.remove('hidden'); }
        }

        window.loginAdmin = function(e) {
            e.preventDefault();
            if (document.getElementById('in-admin-pass').value === ADMIN_PIN) {
                window.isAdmin = true; localStorage.setItem('MW_IS_ADMIN', 'true');
                checkAdminStatus(); window.hideModal('modal-auth'); showToast('Вход выполнен! Режим Автора.');
            } else { showToast('Неверный ПИН-код!'); }
            document.getElementById('in-admin-pass').value = '';
        }

        window.logoutAdmin = function() {
            window.isAdmin = false; localStorage.setItem('MW_IS_ADMIN', 'false');
            checkAdminStatus(); window.toggleDrawer(); showToast('Вы вышли из режима Автора');
        }

        // --- НАВИГАЦИЯ И ВКЛАДКИ ---
        window.goHome = function() {
            document.getElementById('view-details').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            document.body.classList.remove('no-scroll'); 
            window.scrollTo({ top: 0, behavior: 'instant' });
            window.switchTab(currentTab);
        }

        window.switchTab = function(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-primary-500', 'text-white');
                btn.classList.add('border-transparent', 'text-zinc-500');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if(activeBtn) { activeBtn.classList.remove('border-transparent', 'text-zinc-500'); activeBtn.classList.add('border-primary-500', 'text-white'); }

            const grid = document.getElementById('grid-container'); const latest = document.getElementById('latest-container'); const empty = document.getElementById('empty-state');
            grid.innerHTML = ''; latest.innerHTML = ''; grid.classList.add('hidden'); latest.classList.add('hidden'); empty.classList.add('hidden');

            let items = [];
            if (tabId === 'catalog') { items = dbMangas; grid.classList.remove('hidden'); renderGrid(items, grid, empty); } 
            else if (tabId === 'favorites') { items = dbMangas.filter(m => favoriteIds.includes(m.id)); grid.classList.remove('hidden'); renderGrid(items, grid, empty); } 
            else if (tabId === 'latest') {
                latest.classList.remove('hidden');
                const recentChaps = [...dbChapters].sort((a,b) => b.createdAt - a.createdAt).slice(0, 30);
                if (recentChaps.length === 0) empty.classList.remove('hidden');
                else {
                    recentChaps.forEach(chap => {
                        const manga = dbMangas.find(m => m.id === chap.mangaId); if (!manga) return;
                        const d = new Date(chap.createdAt);
                        const timeStr = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        const el = document.createElement('div');
                        el.className = 'flex items-center gap-4 bg-zinc-900/80 p-3 rounded-2xl border border-zinc-800 cursor-pointer card-hover';
                        el.onclick = () => window.openMangaDetails(manga.id);
                        el.innerHTML = `<img src="${manga.cover}" class="w-14 h-14 rounded-xl object-cover bg-zinc-950 shadow-md"><div class="flex-1 min-w-0"><h4 class="font-bold text-white text-sm truncate">${manga.title}</h4><p class="text-primary-400 font-bold text-xs truncate mt-0.5">${chap.title}</p></div><div class="text-[10px] text-zinc-500 font-bold bg-zinc-950 px-2 py-1 rounded-md border border-zinc-800 whitespace-nowrap">${timeStr}</div>`;
                        latest.appendChild(el);
                    });
                }
            }
        }

        function renderGrid(arr, container, emptyEl) {
            if (arr.length === 0) { emptyEl.classList.remove('hidden'); return; }
            arr.forEach(manga => {
                const chaps = dbChapters.filter(c => c.mangaId === manga.id); const lastChap = chaps.length > 0 ? chaps[0].title : 'Нет глав';
                const card = document.createElement('div');
                card.className = 'card-hover bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer relative shadow-lg group flex flex-col';
                card.onclick = () => window.openMangaDetails(manga.id);
                card.innerHTML = `<div class="pt-[140%] relative bg-zinc-950 w-full"><img src="${manga.cover}" class="absolute inset-0 w-full h-full object-cover smooth-transition group-hover:scale-105" onerror="this.src='https://via.placeholder.com/300x450/18181b/ffffff?text=Нет+обложки'"><div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/20 to-transparent"></div></div><div class="p-4 absolute bottom-0 left-0 right-0"><h3 class="font-black text-white text-sm sm:text-base truncate leading-tight">${manga.title}</h3><p class="text-[11px] sm:text-xs font-bold text-primary-400 mt-1 truncate">${lastChap}</p></div>`;
                container.appendChild(card);
            });
        }

        // --- ДЕТАЛИ ---
        window.openMangaDetails = function(id) {
            currentMangaId = id;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-details').classList.remove('hidden');
            document.body.classList.remove('no-scroll');
            window.scrollTo({ top: 0, behavior: 'instant' });
            renderDetails(id);
        }

        function renderDetails(id) {
            const manga = dbMangas.find(m => m.id === id); if(!manga) return;
            document.getElementById('det-title').textContent = manga.title;
            document.getElementById('det-desc').textContent = manga.desc || 'Описание отсутствует.';
            document.getElementById('det-cover').src = manga.cover;

            const icon = document.getElementById('fav-icon');
            if (favoriteIds.includes(manga.id)) { icon.classList.replace('fa-regular', 'fa-solid'); icon.classList.replace('text-zinc-300', 'text-yellow-500'); } 
            else { icon.classList.replace('fa-solid', 'fa-regular'); icon.classList.replace('text-yellow-500', 'text-zinc-300'); }

            const cList = document.getElementById('det-chapters'); cList.innerHTML = '';
            const mChaps = dbChapters.filter(c => c.mangaId === id);
            
            if (mChaps.length === 0) {
                cList.innerHTML = '<div class="text-zinc-500 text-sm font-bold py-6 text-center border-2 border-dashed border-zinc-800 rounded-2xl">Главы еще не вышли</div>';
            } else {
                mChaps.forEach((chap) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-zinc-950/60 hover:bg-zinc-800 p-3 sm:p-4 rounded-2xl border border-zinc-800/80 smooth-transition';
                    let delBtn = window.isAdmin ? `<button onclick="window.deleteChap('${chap.id}')" class="text-zinc-600 hover:text-red-400 p-2 smooth-transition active:scale-90"><i class="fa-solid fa-trash"></i></button>` : '';
                    row.innerHTML = `<span class="font-black text-sm text-zinc-200 cursor-pointer flex-1 truncate hover:text-primary-400 smooth-transition" onclick="window.startReading('${chap.id}')">${chap.title}</span><div class="flex items-center gap-1 sm:gap-2 pl-2">${delBtn}<button onclick="window.startReading('${chap.id}')" class="bg-primary-600/10 text-primary-500 hover:bg-primary-600 hover:text-white text-xs px-4 py-2 rounded-xl font-black smooth-transition active:scale-95">Читать</button></div>`;
                    cList.appendChild(row);
                });
            }
        }

        // --- ЧИТАЛКА (ВЕРТИКАЛЬНАЯ) ---
        window.startReading = function(chapId) {
            const mChaps = dbChapters.filter(c => c.mangaId === currentMangaId);
            const idx = mChaps.findIndex(c => c.id === chapId);
            if (idx === -1) return;
            
            currentChapIdx = idx;
            const chap = mChaps[idx];
            const manga = dbMangas.find(m => m.id === currentMangaId);

            document.getElementById('read-manga-title').textContent = manga.title;
            document.getElementById('read-chapter-title').textContent = chap.title;
            
            // В базе главы сортируются от новых (индекс 0) к старым (последний индекс).
            // "Следующая глава" по сюжету = индекс на 1 меньше (новее по времени).
            document.getElementById('btn-next-chap').disabled = (idx === 0);
            // "Предыдущая глава" по сюжету = индекс на 1 больше (старее по времени).
            document.getElementById('btn-prev-chap').disabled = (idx === mChaps.length - 1);

            const pagesContainer = document.getElementById('reader-pages');
            pagesContainer.innerHTML = '';
            
            // Добавляем все картинки столбиком (без зазоров)
            chap.images.forEach((url) => {
                if(!url.trim()) return;
                const img = document.createElement('img');
                img.src = url.trim();
                // Блочный элемент и убираем отступы, чтобы картинки плотно склеились
                img.className = 'w-full h-auto block m-0 p-0 pointer-events-none';
                pagesContainer.appendChild(img);
            });

            if(chap.images.length === 0) {
                pagesContainer.innerHTML = '<div class="text-zinc-500 p-10 font-bold">В главе нет страниц</div>';
            }

            isUiHidden = false;
            document.getElementById('reader-topbar').classList.remove('reader-ui-hidden');
            document.getElementById('reader-bottombar').classList.remove('reader-ui-hidden-bottom');
            
            document.getElementById('view-details').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('hidden');
            
            document.body.classList.add('no-scroll');
            // Сбрасываем скролл на самый верх
            document.getElementById('view-reader').scrollTo({ top: 0, behavior: 'instant' });
        }

        // Переключение именно ГЛАВ
        window.changeChapter = function(dir) {
            // dir = -1 (новее), dir = 1 (старее)
            const newIdx = currentChapIdx + dir; 
            const mChaps = dbChapters.filter(c => c.mangaId === currentMangaId);
            if (newIdx >= 0 && newIdx < mChaps.length) {
                window.startReading(mChaps[newIdx].id);
            }
        }

        window.closeReader = function() {
            window.openMangaDetails(currentMangaId);
        }

        window.toggleReaderUI = function() {
            isUiHidden = !isUiHidden;
            const top = document.getElementById('reader-topbar');
            const bottom = document.getElementById('reader-bottombar');
            if (isUiHidden) {
                top.classList.add('reader-ui-hidden'); bottom.classList.add('reader-ui-hidden-bottom');
            } else {
                top.classList.remove('reader-ui-hidden'); bottom.classList.remove('reader-ui-hidden-bottom');
            }
        }

        // --- СОЗДАНИЕ В БАЗЕ ---
        window.submitManga = async function(e) {
            e.preventDefault(); if (!window.isAdmin || !dbRef) return;
            const btn = document.getElementById('btn-submit-manga'); btn.disabled = true; btn.textContent = 'Публикация...';
            try {
                await addDoc(collection(dbRef, 'artifacts', appIdStr, 'public', 'data', 'mangas'), {
                    title: document.getElementById('in-title').value.trim(), cover: document.getElementById('in-cover').value.trim(), desc: document.getElementById('in-desc').value.trim(), createdAt: Date.now()
                });
                showToast('Манга успешно опубликована!'); document.getElementById('form-add-manga').reset(); window.hideModal('modal-add-manga');
            } catch (err) { showToast('Ошибка. Возможно нет прав в базе.'); }
            btn.disabled = false; btn.textContent = 'Опубликовать';
        }

        window.submitChapter = async function(e) {
            e.preventDefault(); if (!window.isAdmin || !dbRef) return;
            const btn = document.getElementById('btn-submit-chapter'); btn.disabled = true; btn.textContent = 'Загрузка...';
            const urls = document.getElementById('in-chap-urls').value.split('\n').map(u=>u.trim()).filter(u=>u.length>0);
            try {
                await addDoc(collection(dbRef, 'artifacts', appIdStr, 'public', 'data', 'chapters'), {
                    mangaId: currentMangaId, title: document.getElementById('in-chap-title').value.trim(), images: urls, createdAt: Date.now()
                });
                showToast('Глава добавлена!'); document.getElementById('form-add-chapter').reset(); window.hideModal('modal-add-chapter');
            } catch (err) { showToast('Ошибка загрузки'); }
            btn.disabled = false; btn.textContent = 'Загрузить в базу';
        }

        window.deleteCurrentManga = async function() {
            if(!window.isAdmin || !confirm('Удалить мангу навсегда?')) return;
            try { await deleteDoc(doc(dbRef, 'artifacts', appIdStr, 'public', 'data', 'mangas', currentMangaId)); showToast('Тайтл удален'); window.goHome(); } catch (e) { showToast('Ошибка удаления'); }
        }

        window.deleteChap = async function(id) {
            if(!window.isAdmin || !confirm('Удалить главу?')) return;
            try { await deleteDoc(doc(dbRef, 'artifacts', appIdStr, 'public', 'data', 'chapters', id)); showToast('Глава удалена'); } catch (e) { showToast('Ошибка удаления'); }
        }

        // --- УПРАВЛЕНИЕ МОДАЛКАМИ ---
        window.showModal = function(id) { const el = document.getElementById(id); el.classList.remove('invisible'); document.body.classList.add('no-scroll'); setTimeout(() => el.classList.add('modal-enter'), 10); }
        window.hideModal = function(id) { const el = document.getElementById(id); el.classList.remove('modal-enter'); document.body.classList.remove('no-scroll'); setTimeout(() => el.classList.add('invisible'), 300); }
        window.toggleDrawer = function() {
            const d = document.getElementById('drawer'); const bg = document.getElementById('drawer-backdrop');
            if (d.classList.contains('drawer-open')) { d.classList.remove('drawer-open'); bg.classList.remove('opacity-100'); document.body.classList.remove('no-scroll'); setTimeout(() => bg.classList.add('invisible', 'opacity-0'), 300); } 
            else { bg.classList.remove('invisible', 'opacity-0'); bg.classList.add('opacity-100'); d.classList.add('drawer-open'); document.body.classList.add('no-scroll'); }
        }
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toast-msg').textContent = msg; t.classList.remove('-translate-y-10', 'opacity-0'); setTimeout(() => t.classList.add('-translate-y-10', 'opacity-0'), 3000); }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
