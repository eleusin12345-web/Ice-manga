<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MangaWeb PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#1f1f22', 900: '#18181b', 950: '#09090b' },
                        primary: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Плавность */
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        
        /* Анимации окон */
        .modal-enter { opacity: 1 !important; visibility: visible !important; }
        .modal-enter > div { transform: scale(1) translateY(0) !important; opacity: 1 !important; }
        
        .drawer-open { transform: translateX(0) !important; }
        
        /* Эффект карточек */
        .card-hover:active { transform: scale(0.96); }
        @media (hover: hover) { .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3); } }
        
        /* Скрытие интерфейса читалки */
        .reader-ui-hidden { transform: translateY(-100%); opacity: 0; }
    </style>
</head>
<body class="antialiased overflow-x-hidden select-none pb-safe">

    <!-- ГЛОБАЛЬНЫЙ TOAST (УВЕДОМЛЕНИЯ) -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-primary-600 text-white px-5 py-3 rounded-2xl shadow-2xl font-bold flex items-center gap-3 text-sm opacity-0 pointer-events-none transform -translate-y-10 smooth-transition">
        <i class="fa-solid fa-bell text-lg"></i>
        <span id="toast-msg">Синхронизация...</span>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header id="main-header" class="fixed top-0 left-0 right-0 z-40 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/50 h-16 flex items-center justify-between px-4 smooth-transition">
        <div class="flex items-center gap-4">
            <!-- Кнопка Гамбургер -->
            <button onclick="window.toggleDrawer()" class="text-zinc-400 hover:text-white p-2 text-xl active:scale-90 smooth-transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <!-- Лого -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.goHome()">
                <i class="fa-solid fa-bolt text-primary-500 text-xl"></i>
                <span class="font-black text-xl tracking-tight hidden sm:block">Manga<span class="text-primary-500">PRO</span></span>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Статус Сети -->
            <div id="cloud-status" class="flex items-center gap-2 text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-zinc-900 px-3 py-1.5 rounded-full border border-zinc-800">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text" class="text-zinc-400">Соединение...</span>
            </div>
        </div>
    </header>

    <!-- БОКОВОЕ МЕНЮ (DRAWER) -->
    <div id="drawer-backdrop" onclick="window.toggleDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 opacity-0 invisible smooth-transition"></div>
    <div id="drawer" class="fixed top-0 left-0 bottom-0 w-72 bg-zinc-900 border-r border-zinc-800 z-50 transform -translate-x-full smooth-transition flex flex-col shadow-2xl">
        <div class="p-6 flex items-center justify-between border-b border-zinc-800">
            <span class="font-black text-2xl">Меню</span>
            <button onclick="window.toggleDrawer()" class="text-zinc-500 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-2 px-3">
            <button onclick="window.goHome(); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-300 font-bold smooth-transition">
                <i class="fa-solid fa-house w-6 text-center text-zinc-500"></i> Главная
            </button>
            <button onclick="window.switchTab('favorites'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-300 font-bold smooth-transition">
                <i class="fa-solid fa-star w-6 text-center text-yellow-500"></i> Избранное
            </button>
            
            <div class="my-2 border-t border-zinc-800 mx-3"></div>
            
            <!-- АДМИН ПАНЕЛЬ -->
            <div id="admin-menu" class="hidden flex-col gap-2">
                <div class="text-xs font-bold text-zinc-500 uppercase px-4 mt-2 mb-1 tracking-wider">Управление (Автор)</div>
                <button onclick="window.showModal('modal-add-manga'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl bg-primary-600/10 text-primary-400 hover:bg-primary-600/20 font-bold smooth-transition text-left">
                    <i class="fa-solid fa-plus w-6 text-center"></i> Добавить Мангу
                </button>
                <button onclick="window.logoutAdmin()" class="flex items-center gap-4 p-3 rounded-xl text-red-400 hover:bg-red-500/10 font-bold smooth-transition text-left mt-2">
                    <i class="fa-solid fa-right-from-bracket w-6 text-center"></i> Выйти из Автора
                </button>
            </div>
            
            <button id="btn-login-admin" onclick="window.showModal('modal-auth'); window.toggleDrawer()" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 text-left text-zinc-400 font-bold smooth-transition mt-auto">
                <i class="fa-solid fa-lock w-6 text-center text-zinc-600"></i> Вход для Автора
            </button>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="pt-20 pb-20 px-4 max-w-6xl mx-auto min-h-screen flex flex-col">
        
        <!-- 1. ГЛАВНАЯ СТРАНИЦА -->
        <section id="view-home" class="flex-1 flex flex-col">
            <!-- Вкладки -->
            <div class="flex gap-2 sm:gap-4 mb-6 overflow-x-auto pb-2 custom-scrollbar border-b border-zinc-800">
                <button onclick="window.switchTab('catalog')" id="tab-catalog" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-primary-500 text-white whitespace-nowrap smooth-transition">
                    📚 Каталог
                </button>
                <button onclick="window.switchTab('latest')" id="tab-latest" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 whitespace-nowrap smooth-transition">
                    🔥 Обновления
                </button>
                <button onclick="window.switchTab('favorites')" id="tab-favorites" class="tab-btn px-4 py-2 rounded-t-xl font-bold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 whitespace-nowrap smooth-transition">
                    ⭐ Избранное
                </button>
            </div>

            <!-- Контейнер для списков -->
            <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 relative min-h-[300px]"></div>
            
            <!-- Лента обновлений (Скрыта по умолчанию) -->
            <div id="latest-container" class="hidden flex-col gap-3 relative min-h-[300px]"></div>

            <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-zinc-500 pointer-events-none mt-20">
                <i class="fa-solid fa-box-open text-6xl mb-4 opacity-20"></i>
                <p class="text-lg font-bold">Здесь пока пусто</p>
            </div>
        </section>

        <!-- 2. СТРАНИЦА МАНГИ -->
        <section id="view-details" class="hidden flex-1">
            <button onclick="window.goHome()" class="mb-6 text-zinc-400 hover:text-white flex items-center gap-2 text-sm bg-zinc-900 py-2.5 px-5 rounded-full w-fit border border-zinc-800 smooth-transition active:scale-95">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            
            <div class="bg-zinc-900/50 rounded-[2rem] p-4 sm:p-8 border border-zinc-800/80 flex flex-col md:flex-row gap-6 sm:gap-10 shadow-2xl relative">
                
                <!-- Админ: Удалить мангу -->
                <button onclick="window.deleteCurrentManga()" class="admin-only hidden absolute top-4 right-4 sm:top-8 sm:right-8 text-red-500 hover:text-white bg-red-500/10 hover:bg-red-500 w-12 h-12 rounded-2xl flex items-center justify-center smooth-transition shadow-lg" title="Удалить тайтл">
                    <i class="fa-solid fa-trash"></i>
                </button>

                <!-- Обложка -->
                <div class="w-full md:w-72 shrink-0 relative group">
                    <img id="det-cover" src="" class="w-full aspect-[2/3] object-cover rounded-2xl bg-zinc-950 shadow-2xl border border-zinc-800" alt="Cover">
                    <button onclick="window.toggleFavorite()" id="btn-fav" class="absolute bottom-4 right-4 w-12 h-12 bg-zinc-900/80 backdrop-blur-md border border-zinc-700 rounded-full flex items-center justify-center text-xl smooth-transition hover:scale-110 shadow-lg">
                        <i class="fa-regular fa-star text-zinc-300" id="fav-icon"></i>
                    </button>
                </div>
                
                <!-- Инфо -->
                <div class="flex-1 flex flex-col">
                    <h1 id="det-title" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white pr-12 mb-4 leading-tight">...</h1>
                    
                    <div class="bg-zinc-950/50 p-5 rounded-2xl mb-8 border border-zinc-800/50">
                        <h3 class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-3">Описание</h3>
                        <p id="det-desc" class="text-zinc-300 text-sm sm:text-base leading-relaxed">...</p>
                    </div>
                    
                    <div class="mt-auto">
                        <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800">
                            <h3 class="font-black text-xl text-white">Список глав</h3>
                            
                            <!-- Админ: Добавить главу -->
                            <button onclick="window.showModal('modal-add-chapter')" class="admin-only hidden bg-primary-600 hover:bg-primary-500 text-white font-bold text-sm py-2 px-4 rounded-xl flex items-center gap-2 smooth-transition shadow-lg shadow-primary-600/20 active:scale-95">
                                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Добавить</span>
                            </button>
                        </div>
                        
                        <div id="det-chapters" class="flex flex-col gap-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 3. ЧИТАЛКА (НА ВЕСЬ ЭКРАН) -->
    <div id="view-reader" class="hidden fixed inset-0 z-50 bg-black overflow-y-auto custom-scrollbar">
        <!-- Кликабельная зона для скрытия UI -->
        <div id="reader-click-zone" class="absolute inset-0 z-0" onclick="window.toggleReaderUI()"></div>
        
        <!-- Верхний бар -->
        <div id="reader-topbar" class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-lg border-b border-zinc-800/80 p-4 flex items-center justify-between z-20 smooth-transition">
            <button onclick="window.closeReader()" class="text-zinc-400 hover:text-white bg-zinc-900 w-10 h-10 rounded-full flex items-center justify-center smooth-transition active:scale-90">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="text-center truncate px-4 pointer-events-none">
                <div id="read-manga-title" class="text-xs font-bold text-zinc-500 uppercase tracking-widest truncate">...</div>
                <div id="read-chapter-title" class="text-sm sm:text-base font-black text-primary-400 truncate mt-0.5">...</div>
            </div>
            <div class="w-10"></div> <!-- Placeholder for centering -->
        </div>

        <!-- Контейнер картинок -->
        <div id="reader-pages" class="relative z-10 max-w-[800px] mx-auto pt-24 pb-10 flex flex-col items-center min-h-screen pointer-events-none">
            <!-- Картинки будут здесь -->
        </div>

        <!-- Нижний бар навигации -->
        <div id="reader-bottombar" class="relative z-20 max-w-[800px] mx-auto px-4 pb-12 pt-6">
            <div class="grid grid-cols-2 gap-4">
                <button id="btn-prev-chap" onclick="window.changeChapter(-1)" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-white font-bold py-4 rounded-2xl smooth-transition disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Предыдущая</span>
                </button>
                <button id="btn-next-chap" onclick="window.changeChapter(1)" class="bg-primary-600 hover:bg-primary-500 text-white font-bold py-4 rounded-2xl smooth-transition disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 shadow-xl shadow-primary-600/20 flex items-center justify-center gap-2">
                    <span class="hidden sm:inline">Следующая</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА (Скрыты по умолчанию) -->
    
    <!-- Вход для автора -->
    <div id="modal-auth" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-[2rem] p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition text-center">
            <div class="w-16 h-16 bg-primary-600/10 text-primary-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h3 class="text-2xl font-black text-white mb-2">Создатель</h3>
            <p class="text-sm text-zinc-500 mb-8">Введите ПИН-код для управления контентом</p>
            <form onsubmit="window.loginAdmin(event)" class="space-y-4">
                <input type="password" id="in-admin-pass" required class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-center text-white tracking-widest font-bold text-xl focus:outline-none focus:border-primary-500 smooth-transition" placeholder="****">
                <button type="submit" class="w-full bg-primary-600 hover:bg-primary-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 smooth-transition">Войти</button>
            </form>
            <button onclick="window.hideModal('modal-auth')" class="mt-6 text-sm font-bold text-zinc-500 hover:text-zinc-300">Отмена</button>
        </div>
    </div>

    <!-- Добавить Мангу -->
    <div id="modal-add-manga" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-white">Новый тайтл</h3>
                <button onclick="window.hideModal('modal-add-manga')" class="text-zinc-500 hover:text-white bg-zinc-800/50 w-10 h-10 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="window.submitManga(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Название</label>
                    <input type="text" id="in-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="Берсерк">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Ссылка на обложку (URL)</label>
                    <input type="url" id="in-cover" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Сюжет</label>
                    <textarea id="in-desc" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none resize-none" placeholder="Краткое описание..."></textarea>
                </div>
                <button type="submit" id="btn-submit-manga" class="w-full bg-primary-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 smooth-transition mt-2">Опубликовать в онлайн</button>
            </form>
        </div>
    </div>

    <!-- Добавить Главу -->
    <div id="modal-add-chapter" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 opacity-0 invisible smooth-transition">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl transform scale-95 translate-y-10 smooth-transition">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-white">Новая глава</h3>
                <button onclick="window.hideModal('modal-add-chapter')" class="text-zinc-500 hover:text-white bg-zinc-800/50 w-10 h-10 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="window.submitChapter(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Название главы</label>
                    <input type="text" id="in-chap-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white focus:border-primary-500 outline-none" placeholder="Глава 1: Начало">
                </div>
                <div>
                    <label class="block text-xs font-black text-zinc-500 uppercase tracking-widest mb-2">Ссылки на страницы (Каждая с новой строки)</label>
                    <textarea id="in-chap-urls" required rows="6" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white text-xs whitespace-pre focus:border-primary-500 outline-none" placeholder="https://page1.jpg&#10;https://page2.jpg"></textarea>
                </div>
                <button type="submit" id="btn-submit-chapter" class="w-full bg-primary-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 smooth-transition mt-2">Загрузить главу</button>
            </form>
        </div>
    </div>

    <!-- FIREBASE И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // НАСТРОЙКИ
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'manga-web-pro-v3';
        const ADMIN_PIN = "1234"; // Твой секретный пароль для создания

        // СОСТОЯНИЕ
        let dbRef = null;
        let authRef = null;
        let user = null;
        
        let dbMangas = [];
        let dbChapters = [];
        let favoriteIds = [];
        
        let currentTab = 'catalog'; // catalog, latest, favorites
        let currentMangaId = null;
        let currentChapIdx = null;
        let isUiHidden = false;
        
        // Экспорт функций в окно для HTML
        window.isAdmin = localStorage.getItem('MW_IS_ADMIN') === 'true';

        // --- 1. ИНИЦИАЛИЗАЦИЯ ---
        async function initApp() {
            loadFavorites();
            checkAdminStatus();
            
            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (!config) {
                setNetStatus('offline', 'Оффлайн');
                return;
            }

            try {
                const app = initializeApp(config);
                authRef = getAuth(app);
                dbRef = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(authRef, __initial_auth_token);
                } else {
                    await signInAnonymously(authRef);
                }

                onAuthStateChanged(authRef, (u) => {
                    user = u;
                    if (user) {
                        setNetStatus('online', 'В сети');
                        listenData();
                    }
                });
            } catch (err) {
                console.error("Firebase Error:", err);
                setNetStatus('error', 'Ошибка сети');
            }
        }

        function setNetStatus(type, text) {
            const dot = document.getElementById('status-dot');
            document.getElementById('status-text').textContent = text;
            
            dot.className = 'w-2 h-2 rounded-full ' + 
                (type === 'online' ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 
                 type === 'error' ? 'bg-red-500' : 'bg-amber-500 animate-pulse');
        }

        function listenData() {
            if (!user || !dbRef) return;
            
            onSnapshot(collection(dbRef, 'artifacts', appId, 'public', 'data', 'mangas'), (snap) => {
                dbMangas = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                refreshUI();
            });

            onSnapshot(collection(dbRef, 'artifacts', appId, 'public', 'data', 'chapters'), (snap) => {
                dbChapters = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                refreshUI();
            });
        }

        function refreshUI() {
            if (!document.getElementById('view-home').classList.contains('hidden')) window.switchTab(currentTab);
            if (!document.getElementById('view-details').classList.contains('hidden') && currentMangaId) renderDetails(currentMangaId);
        }

        // --- 2. ВНУТРЕННЯЯ ЛОГИКА И ЗАКЛАДКИ ---
        function loadFavorites() {
            try { favoriteIds = JSON.parse(localStorage.getItem('MW_FAVS') || '[]'); } catch(e) { favoriteIds = []; }
        }
        function saveFavorites() {
            localStorage.setItem('MW_FAVS', JSON.stringify(favoriteIds));
        }

        window.toggleFavorite = function() {
            if (!currentMangaId) return;
            const idx = favoriteIds.indexOf(currentMangaId);
            if (idx === -1) {
                favoriteIds.push(currentMangaId);
                showToast('Добавлено в Избранное ⭐');
            } else {
                favoriteIds.splice(idx, 1);
                showToast('Удалено из Избранного');
            }
            saveFavorites();
            renderDetails(currentMangaId); // обновить иконку
        }

        // --- 3. АДМИНКА ---
        function checkAdminStatus() {
            const els = document.querySelectorAll('.admin-only');
            els.forEach(el => window.isAdmin ? el.classList.remove('hidden') : el.classList.add('hidden'));
            
            const menu = document.getElementById('admin-menu');
            const loginBtn = document.getElementById('btn-login-admin');
            if (window.isAdmin) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                loginBtn.classList.add('hidden');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                loginBtn.classList.remove('hidden');
            }
        }

        window.loginAdmin = function(e) {
            e.preventDefault();
            const pass = document.getElementById('in-admin-pass').value;
            if (pass === ADMIN_PIN) {
                window.isAdmin = true;
                localStorage.setItem('MW_IS_ADMIN', 'true');
                checkAdminStatus();
                window.hideModal('modal-auth');
                showToast('Вход выполнен! Режим Автора.');
            } else {
                showToast('Неверный ПИН-код!');
            }
            document.getElementById('in-admin-pass').value = '';
        }

        window.logoutAdmin = function() {
            window.isAdmin = false;
            localStorage.setItem('MW_IS_ADMIN', 'false');
            checkAdminStatus();
            window.toggleDrawer();
            showToast('Вы вышли из режима Автора');
        }

        // --- 4. НАВИГАЦИЯ ---
        window.goHome = function() {
            document.getElementById('view-details').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            window.scrollTo(0,0);
            window.switchTab(currentTab);
        }

        window.switchTab = function(tabId) {
            currentTab = tabId;
            // Активный стиль вкладок
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-primary-500', 'text-white');
                btn.classList.add('border-transparent', 'text-zinc-500');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-zinc-500');
                activeBtn.classList.add('border-primary-500', 'text-white');
            }

            const grid = document.getElementById('grid-container');
            const latest = document.getElementById('latest-container');
            const empty = document.getElementById('empty-state');
            
            grid.innerHTML = ''; latest.innerHTML = '';
            grid.classList.add('hidden'); latest.classList.add('hidden'); empty.classList.add('hidden');

            let items = [];
            
            if (tabId === 'catalog') {
                items = dbMangas;
                grid.classList.remove('hidden');
                renderGrid(items, grid, empty);
            } 
            else if (tabId === 'favorites') {
                items = dbMangas.filter(m => favoriteIds.includes(m.id));
                grid.classList.remove('hidden');
                renderGrid(items, grid, empty);
            }
            else if (tabId === 'latest') {
                latest.classList.remove('hidden');
                // Берем 20 последних глав
                const recentChaps = [...dbChapters].sort((a,b) => b.createdAt - a.createdAt).slice(0, 20);
                if (recentChaps.length === 0) empty.classList.remove('hidden');
                else {
                    recentChaps.forEach(chap => {
                        const manga = dbMangas.find(m => m.id === chap.mangaId);
                        if (!manga) return;
                        
                        // Формат времени
                        const d = new Date(chap.createdAt);
                        const timeStr = `${d.getDate()}.${d.getMonth()+1} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

                        const el = document.createElement('div');
                        el.className = 'flex items-center gap-4 bg-zinc-900/80 p-3 rounded-2xl border border-zinc-800 cursor-pointer card-hover';
                        el.onclick = () => {
                            window.openMangaDetails(manga.id);
                            // Ищем индекс этой главы в манге, чтобы открыть ридер (опционально)
                        };
                        el.innerHTML = `
                            <img src="${manga.cover}" class="w-14 h-14 rounded-xl object-cover bg-zinc-950 shadow-md">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-white text-sm truncate">${manga.title}</h4>
                                <p class="text-primary-400 font-bold text-xs truncate mt-0.5">${chap.title}</p>
                            </div>
                            <div class="text-[10px] text-zinc-500 font-bold bg-zinc-950 px-2 py-1 rounded-md border border-zinc-800 whitespace-nowrap">${timeStr}</div>
                        `;
                        latest.appendChild(el);
                    });
                }
            }
        }

        function renderGrid(arr, container, emptyEl) {
            if (arr.length === 0) { emptyEl.classList.remove('hidden'); return; }
            
            arr.forEach(manga => {
                const chaps = dbChapters.filter(c => c.mangaId === manga.id);
                const lastChap = chaps.length > 0 ? chaps[0].title : 'Нет глав'; // Т.к. главы отсортированы по убыванию даты

                const card = document.createElement('div');
                card.className = 'card-hover bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer relative shadow-lg group';
                card.onclick = () => window.openMangaDetails(manga.id);
                card.innerHTML = `
                    <div class="pt-[140%] relative bg-zinc-950">
                        <img src="${manga.cover}" class="absolute inset-0 w-full h-full object-cover smooth-transition group-hover:scale-105" onerror="this.src='https://via.placeholder.com/300x400/18181b/ffffff?text=Нет+обложки'">
                        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/20 to-transparent"></div>
                    </div>
                    <div class="p-4 absolute bottom-0 left-0 right-0">
                        <h3 class="font-black text-white text-sm sm:text-base truncate leading-tight">${manga.title}</h3>
                        <p class="text-[11px] sm:text-xs font-bold text-primary-400 mt-1 truncate">${lastChap}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 5. ДЕТАЛИ ---
        window.openMangaDetails = function(id) {
            currentMangaId = id;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-details').classList.remove('hidden');
            window.scrollTo(0,0);
            renderDetails(id);
        }

        function renderDetails(id) {
            const manga = dbMangas.find(m => m.id === id);
            if(!manga) return;

            document.getElementById('det-title').textContent = manga.title;
            document.getElementById('det-desc').textContent = manga.desc || 'Описание отсутствует.';
            document.getElementById('det-cover').src = manga.cover;

            const icon = document.getElementById('fav-icon');
            if (favoriteIds.includes(manga.id)) {
                icon.classList.replace('fa-regular', 'fa-solid');
                icon.classList.replace('text-zinc-300', 'text-yellow-500');
            } else {
                icon.classList.replace('fa-solid', 'fa-regular');
                icon.classList.replace('text-yellow-500', 'text-zinc-300');
            }

            const cList = document.getElementById('det-chapters');
            cList.innerHTML = '';
            
            // Главы манги, отсортированные по времени (Новые сверху)
            const mChaps = dbChapters.filter(c => c.mangaId === id);
            
            if (mChaps.length === 0) {
                cList.innerHTML = '<div class="text-zinc-500 text-sm font-bold py-6 text-center border-2 border-dashed border-zinc-800 rounded-2xl">Главы еще не вышли</div>';
            } else {
                mChaps.forEach((chap, idx) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-zinc-950/60 hover:bg-zinc-800 p-3 sm:p-4 rounded-2xl border border-zinc-800/80 smooth-transition';
                    
                    let delBtn = window.isAdmin ? `
                        <button onclick="window.deleteChap('${chap.id}')" class="text-zinc-600 hover:text-red-400 p-2 smooth-transition active:scale-90">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    ` : '';

                    row.innerHTML = `
                        <span class="font-black text-sm text-zinc-200 cursor-pointer flex-1 truncate hover:text-primary-400 smooth-transition" onclick="window.startReading('${chap.id}')">
                            ${chap.title}
                        </span>
                        <div class="flex items-center gap-1 sm:gap-2 pl-2">
                            ${delBtn}
                            <button onclick="window.startReading('${chap.id}')" class="bg-primary-600/10 text-primary-500 hover:bg-primary-600 hover:text-white text-xs px-4 py-2 rounded-xl font-black smooth-transition active:scale-95">
                                Читать
                            </button>
                        </div>
                    `;
                    cList.appendChild(row);
                });
            }
        }

        // --- 6. ЧИТАЛКА ---
        window.startReading = function(chapId) {
            const mChaps = dbChapters.filter(c => c.mangaId === currentMangaId);
            // Индекс в массиве mChaps (где 0 - самая новая)
            const idx = mChaps.findIndex(c => c.id === chapId);
            if (idx === -1) return;
            
            currentChapIdx = idx;
            const chap = mChaps[idx];
            const manga = dbMangas.find(m => m.id === currentMangaId);

            document.getElementById('read-manga-title').textContent = manga.title;
            document.getElementById('read-chapter-title').textContent = chap.title;
            
            // В массиве mChaps индекс 0 = новейшая глава.
            // Значит "Следующая" глава (сюжетно) - это индекс idx - 1.
            // "Предыдущая" глава (сюжетно) - это индекс idx + 1.
            document.getElementById('btn-next-chap').disabled = (idx === 0);
            document.getElementById('btn-prev-chap').disabled = (idx === mChaps.length - 1);

            const pages = document.getElementById('reader-pages');
            pages.innerHTML = '';
            
            chap.images.forEach((url, i) => {
                if(!url.trim()) return;
                const img = document.createElement('img');
                img.src = url.trim();
                img.className = 'w-full object-contain mb-0 pointer-events-auto';
                pages.appendChild(img);
            });

            // Показываем интерфейс читалки
            isUiHidden = false;
            document.getElementById('reader-topbar').classList.remove('reader-ui-hidden');
            
            document.getElementById('view-details').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        window.closeReader = function() {
            window.openMangaDetails(currentMangaId);
        }

        window.changeChapter = function(dir) {
            // dir: 1 (След), -1 (Пред)
            // У нас массив от новых к старым (0 - новая, N - старая)
            // След. по сюжету -> идем к индексу 0 (т.е. idx - 1)
            const newIdx = currentChapIdx - dir; 
            const mChaps = dbChapters.filter(c => c.mangaId === currentMangaId);
            if (newIdx >= 0 && newIdx < mChaps.length) {
                window.startReading(mChaps[newIdx].id);
            }
        }

        window.toggleReaderUI = function() {
            isUiHidden = !isUiHidden;
            const bar = document.getElementById('reader-topbar');
            if (isUiHidden) bar.classList.add('reader-ui-hidden');
            else bar.classList.remove('reader-ui-hidden');
        }

        // --- 7. СОЗДАНИЕ И УДАЛЕНИЕ (ТОЛЬКО ДЛЯ АВТОРА) ---
        window.submitManga = async function(e) {
            e.preventDefault();
            if (!window.isAdmin || !dbRef || !user) return;
            const btn = document.getElementById('btn-submit-manga');
            btn.disabled = true; btn.textContent = 'Публикация...';

            const title = document.getElementById('in-title').value.trim();
            const cover = document.getElementById('in-cover').value.trim();
            const desc = document.getElementById('in-desc').value.trim();

            try {
                await addDoc(collection(dbRef, 'artifacts', appId, 'public', 'data', 'mangas'), {
                    title, cover, desc, createdAt: Date.now()
                });
                showToast('Манга успешно опубликована!');
                document.getElementById('form-add-manga').reset();
                window.hideModal('modal-add-manga');
            } catch (err) {
                showToast('Ошибка публикации');
            }
            btn.disabled = false; btn.textContent = 'Опубликовать в онлайн';
        }

        window.submitChapter = async function(e) {
            e.preventDefault();
            if (!window.isAdmin || !dbRef || !user) return;
            const btn = document.getElementById('btn-submit-chapter');
            btn.disabled = true; btn.textContent = 'Загрузка...';

            const title = document.getElementById('in-chap-title').value.trim();
            const urls = document.getElementById('in-chap-urls').value.split('\n').map(u=>u.trim()).filter(u=>u.length>0);

            try {
                await addDoc(collection(dbRef, 'artifacts', appId, 'public', 'data', 'chapters'), {
                    mangaId: currentMangaId, title, images: urls, createdAt: Date.now()
                });
                showToast('Глава добавлена!');
                document.getElementById('form-add-chapter').reset();
                window.hideModal('modal-add-chapter');
            } catch (err) {
                showToast('Ошибка загрузки');
            }
            btn.disabled = false; btn.textContent = 'Загрузить главу';
        }

        window.deleteCurrentManga = async function() {
            if(!window.isAdmin || !confirm('Удалить мангу навсегда?')) return;
            try {
                await deleteDoc(doc(dbRef, 'artifacts', appId, 'public', 'data', 'mangas', currentMangaId));
                // По-хорошему тут еще удалить главы, но для упрощения удаляем сам тайтл.
                showToast('Тайтл удален');
                window.goHome();
            } catch (e) { showToast('Ошибка удаления'); }
        }

        window.deleteChap = async function(id) {
            if(!window.isAdmin || !confirm('Удалить главу?')) return;
            try {
                await deleteDoc(doc(dbRef, 'artifacts', appId, 'public', 'data', 'chapters', id));
                showToast('Глава удалена');
            } catch (e) { showToast('Ошибка удаления'); }
        }

        // --- 8. UI УТИЛИТЫ ---
        window.showModal = function(id) {
            const el = document.getElementById(id);
            el.classList.remove('invisible');
            setTimeout(() => el.classList.add('modal-enter'), 10);
        }
        window.hideModal = function(id) {
            const el = document.getElementById(id);
            el.classList.remove('modal-enter');
            setTimeout(() => el.classList.add('invisible'), 300);
        }
        window.toggleDrawer = function() {
            const d = document.getElementById('drawer');
            const bg = document.getElementById('drawer-backdrop');
            if (d.classList.contains('drawer-open')) {
                d.classList.remove('drawer-open');
                bg.classList.remove('opacity-100');
                setTimeout(() => bg.classList.add('invisible', 'opacity-0'), 300);
            } else {
                bg.classList.remove('invisible', 'opacity-0');
                bg.classList.add('opacity-100');
                d.classList.add('drawer-open');
            }
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('-translate-y-10', 'opacity-0');
            setTimeout(() => t.classList.add('-translate-y-10', 'opacity-0'), 3000);
        }

        // СТАРТ
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
